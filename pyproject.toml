[project]
name = "ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abhishektw456", email = "abhishek.singh@thoughtwin.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "google-genai>=2.19.0",
    "langchain>=1.3.17",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "openai>=3.3.1",
    "pydantic>=2.13.4",
    "pypdf>=6.16.2",
    "wikipedia>=1.4.0",
]

[project.scripts]
ai = "ai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
